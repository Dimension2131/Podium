<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Podium</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="screen">
        <div class="card">
            <h1>Podium</h1>
            <p class="mute">Guess the rankings list before the other buggers do.</p>
            <label for="name">Your name</label>
            <input id="name" maxlength="16">
            <div id="finder">
                <label for="saved">Saved lists</label>
                <select id="saved">
                    <option value="">Loading saved lists…</option>
                </select>
                <label for="q">Find or generate a list</label>
                <div class="row"><input id="q" maxlength="40" autocomplete="off"
                        placeholder="Try: top footballers, best movies, richest people"><button id="qgo"
                        class="alt">Search</button></div>
                <ul class="plist results" id="results"></ul>
                <div id="recent"></div>
                <p class="mute">If u cant find what u want just make it urself <a href="create.html">Write your own</a>
                </p>
            </div>
            <div class="picked" id="picked" hidden>
                <label>Chosen list</label>
                <div class="row"><span class="chip" id="pickedname"></span><button id="clear" class="alt">Change
                        list</button></div>
                <p class="mute" id="pnote" hidden>Generated by gemini from web search. Rankings can possibly be wrong,
                    dont blame me.</p>
                <div class="setup">
                    <label>Game timer</label>
                    <div class="seg" id="tseg"><button class="alt" data-t="3">3 min</button><button class="alt on"
                            data-t="5">5 min</button><button class="alt" data-t="10">10 min</button><button class="alt"
                            data-t="c">Custom</button></div>
                    <div id="tcwrap" hidden><label for="tcustom">Minutes (3 to 60)</label><input id="tcustom"
                            type="number" min="3" max="60" step="1" value="5"></div>
                    <label>Points per rank</label>
                    <div class="seg" id="pseg"><button class="alt on" data-p="lin">Top ranks most</button><button
                            class="alt" data-p="rev">Top ranks least</button><button class="alt"
                            data-p="tier">Tiered</button><button class="alt" data-p="custom">Custom</button></div>
                    <p class="mute" id="ppreview"></p>
                    <div class="pgrid" id="pcustom" hidden></div>
                    <label>Hints</label>
                    <div class="fieldrow">
                        <div><label for="hmax">Per player (0 to 10)</label><input id="hmax" type="number" min="0"
                                max="10" step="1" value="2"></div>
                        <div><label for="hcost">Cost each (points)</label><input id="hcost" type="number" min="0"
                                max="999" step="1" value="0"></div>
                    </div>
                </div>
            </div>
            <p><button id="create" style="width:100%" disabled>Create room</button></p>
            <div class="divider"></div>
            <label for="joincode">Or join with a room code</label>
            <div class="row"><input id="joincode" maxlength="4" style="text-transform:uppercase"><button id="join"
                    class="alt">Join</button></div>
        </div>
    </main>
    <div id="toast" hidden></div>
    <script type="module" src="js/home.js"></script>
</body>

</html>
